<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezerwacja Pociągów</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f5f7; 
            font-family: 'Arial', sans-serif;
            padding: 40px 0;
        }
        .section-title {
            text-align: center;
            letter-spacing: 4px;
            font-weight: 800;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        .ui-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 40px;
            margin-bottom: 60px;
        }
        /* Style dla tabeli H1 */
        .orange-bar {
            background-color: #ff7f0e;
            color: white;
            border-radius: 50px;
            padding: 15px 40px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
        }
        .custom-table {
            border: 3px solid black;
            text-align: center;
        }
        .custom-table th, .custom-table td {
            border: 3px solid black;
            padding: 20px;
            vertical-align: middle;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 900px;">

    <h2 class="section-title">Dostępne pociągi</h2>
    <div class="ui-card">
        <div class="orange-bar">
            <span>Warszawa</span>
            <span>|</span>
            <span>1x Pasażer</span>
            <span>|</span>
            <span>1x Bilet Normalny</span>
        </div>

        <table class="table custom-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Kierunek</th>
                    <th>Dostępne miejsca</th>
                </tr>
            </thead>
            <tbody id="trains-list">
                <tr><td>1</td><td>Gdańsk</td><td>45</td></tr>
                <tr><td>2</td><td>Kraków</td><td>120</td></tr>
                <tr><td>3</td><td>Wrocław</td><td>87</td></tr>
            </tbody>
        </table>
    </div>
    </div>

</div>

</body>
</html>
